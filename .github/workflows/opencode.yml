name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  issues: read
  pull-requests: read

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Read-only token for `gh` to inspect builds and pull requests.
          GH_TOKEN: ${{ github.token }}
          # CI 没有交互端，任何 permission=ask 都会一直等到 job timeout。
          # 权限全部放开；question 单独 deny，因为 CI 里没人回答问题，提问同样会卡住。
          # 仅对 CI 生效，本地配置不受影响。
          OPENCODE_CONFIG_CONTENT: '{"permission":{"*":"allow","question":"deny"}}'
        with:
          model: deepseek/deepseek-flash
